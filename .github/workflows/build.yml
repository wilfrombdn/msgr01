# Builds Tellem and runs every test on GitHub's machines (much faster than the laptop).
# Runs on every push to main; the test report, screenshots and a test APK are attached to each run.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      # Actions are pinned to exact commits (a moved tag can't change what runs here); Dependabot opens a PR when a newer one is out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's Ubuntu machines already have the Android SDK; just add the NDK we need
      - name: Install the NDK (strips libsignal's native library)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.3.13750724" > /dev/null

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Server tests (limits, lockout, migration, identity, circuit IDs)
        working-directory: server
        run: |
          python3 -m pip install --quiet cryptography
          python3 -m unittest test_relay -v

      - name: Start a local test relay
        working-directory: server
        run: |
          python3 relay.py --port 8099 --db "$RUNNER_TEMP/t.db" --test-limits > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done

      - name: Tests
        # lenient here only: the checksum list (gradle/verification-metadata.xml) is made on Windows, where the release is built and
        # checked strictly; the Linux runner needs a few platform-specific tool files that aren't on that list.
        run: bash ./gradlew testDebugUnitTest --stacktrace -Dorg.gradle.dependency.verification=lenient

      # No signing key here, so this APK is debug-signed: for checking the build, not for installing
      # over the real app. The published APK is still signed on the laptop.
      - name: Release build
        run: bash ./gradlew assembleRelease -Dorg.gradle.dependency.verification=lenient

      - name: Test results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/shots/

      - name: Test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-unsigned-check
          path: android/app/build/outputs/apk/release/*.apk
