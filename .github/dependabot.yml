# Opens a pull request when a newer Tor (kmp-tor) comes out. The Tor network eventually refuses old
# Tor versions ("missing protocols"), so the app's built-in Tor has to be kept current.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    allow:
      - dependency-name: "io.matthewnelson.kmp-tor:*"
      - dependency-name: "org.signal:*"
      - dependency-name: "org.bouncycastle:*"
      - dependency-name: "com.google.crypto.tink:*"
  # the build's own steps are pinned to exact commits; this keeps those pins current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
